<!DOCTYPE html>
<html lang="en" data-theme="nougate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nougate Admin Dashboard</title>
    <!-- One SVG, no PNG ladder: the mark carries its own background, so it needs
         no light/dark variant, and it is drawn from vectors at every size a tab,
         a bookmark or a pinned shortcut asks for. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0BAF90" />
    <!-- This bundle knows how to be shown inside a host's dashboard (src/lib/host.ts). A host checks
         for this line before offering the page: an update that replaced the gateway but not this
         bundle would otherwise frame a dashboard that calls the host's API instead of the gateway's. -->
    <meta name="nougate-embeddable" content="1" />
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-base-100 text-base-content antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
