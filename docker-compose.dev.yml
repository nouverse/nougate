name: nougate-dev

services:
  nougate:
    container_name: nougate-dev
    image: oven/bun:1.4-alpine
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command:
      - |
        # Install inotify-tools for efficient file watching
        apk add --no-cache inotify-tools >/dev/null 2>&1

        echo "══════════════════════════════════════════"
        echo "  🚀 Nougate Dev — Building frontend..."
        echo "══════════════════════════════════════════"

        # Install backend deps into the container's own node_modules
        cd /app && bun install --frozen-lockfile 2>/dev/null || bun install

        # Install frontend deps & initial build
        cd /app/apps/frontend && bun install --frozen-lockfile 2>/dev/null || bun install
        # Not `&& echo ✅`: vite builds with emptyOutDir, so a build that fails partway leaves dist
        # in place and empty. Claiming success there sends whoever meets the resulting 503 looking
        # for a mount problem instead of at the twenty lines of build output just above.
        if bun run build; then
          echo "✅ Frontend built → /app/apps/frontend/dist"
        else
          echo "❌ Frontend build FAILED — the dashboard will answer 503 until this is fixed"
        fi

        # Start frontend watcher in background
        (
          echo "👀 Watching frontend for changes..."
          while true; do
            inotifywait -r -q \
              -e modify,create,delete,move \
              --exclude '(node_modules|dist|\.tanstack|routeTree\.gen)' \
              /app/apps/frontend/src /app/apps/frontend/index.html 2>/dev/null
            echo ""
            echo "🔄 Frontend change detected, rebuilding..."
            cd /app/apps/frontend
            # Captured rather than piped to `tail`: a pipeline's status is the *last* command's, so
            # `bun run build | tail -5` succeeds even when the build does not — which is how a failed
            # rebuild used to print a tick. On failure the whole output is shown, because the five
            # lines a tail keeps are the summary, not the error.
            if build_output=$$(bun run build 2>&1); then
              echo "$$build_output" | tail -5
              echo "✅ Frontend rebuilt at $$(date '+%H:%M:%S')"
            else
              echo "$$build_output"
              echo "❌ Frontend rebuild FAILED at $$(date '+%H:%M:%S') — dist is now empty, dashboard will 503"
            fi
          done
        ) &

        # Start backend with watch mode (auto-restarts on source changes)
        echo "══════════════════════════════════════════"
        echo "  🟢 Starting backend (watch mode)..."
        echo "  📡 http://localhost:$${PORT:-3000}"
        echo "  📊 http://localhost:$${PORT:-3000}/frontend/"
        echo "══════════════════════════════════════════"
        cd /app && bun run --watch apps/backend/src/server.ts
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    # See docker-compose.prod.yml for why env_file is needed alongside
    # environment: .env alone never reaches the container.
    env_file:
      - path: .env
        required: false
    environment:
      # Explicit entries win over env_file.
      - NODE_ENV=development
      - HEADROOM_URL=${HEADROOM_URL:-}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - PORT=${PORT:-3000}
      # The rest are listed rather than left to env_file so this file is the
      # full inventory of what the container reads. `${VAR:-}` leaves a variable
      # as an empty string when .env does not set it, which each of these treats
      # as unset.
      # ── Dashboard bootstrap account ──
      # Required on a fresh deployment. No fallback: unset means nobody can sign
      # in. Read only while the user table is empty.
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      # ── Dashboard sessions ──
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-}
      # Database (DB_URL, NOUGATE_DB_PATH) and the pricing fallbacks are
      # deliberately not listed, so nothing here overrides them. They still reach
      # the container through env_file above when .env sets them.
      # ── Pod limits ──
      # Blank = not enforced. BOTTOM_JITTER is a floor on every provider's
      # request delay; MAX_ACCOUNT_MULTIPLEXING caps accounts per provider.
      - BOTTOM_JITTER=${BOTTOM_JITTER:-}
      - MAX_ACCOUNT_MULTIPLEXING=${MAX_ACCOUNT_MULTIPLEXING:-}
    volumes:
      # ── Backend ──
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/package.json:/app/apps/backend/package.json:ro
      - ./apps/backend/tsconfig.json:/app/apps/backend/tsconfig.json:ro
      - backend_node_modules:/app/apps/backend/node_modules
      # ── Frontend (source watched → builds to dist inside container) ──
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/index.html:/app/apps/frontend/index.html:ro
      - ./apps/frontend/package.json:/app/apps/frontend/package.json:ro
      - ./apps/frontend/tsconfig.json:/app/apps/frontend/tsconfig.json:ro
      - ./apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts:ro
      - ./apps/frontend/bun.lock:/app/apps/frontend/bun.lock
      - frontend_node_modules:/app/apps/frontend/node_modules
      # ── Shared config ──
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock
      # Bun hoists workspace packages here; the backend's node_modules entries
      # are symlinks into it, so it has to be a real directory in the container.
      - root_node_modules:/app/node_modules
      # ── Persistent data ──
      - ./data:/app/data:z
    depends_on:
      - headroom
    restart: unless-stopped

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom-dev
    restart: unless-stopped
    ports:
      - "8787:8787"

volumes:
  frontend_node_modules:
  backend_node_modules:
  root_node_modules:
