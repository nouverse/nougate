name: Build and Push to GHCR

# Built only from a commit of `main` whose Test run passed, never by hand from any branch: on 2026-10-16 an image was
# pushed from a commit whose tests failed (Nouride's REVIEW B1). Tagged with that commit's short SHA and `latest`;
# the host deploys a commit's tag (README, "Deploying an image"). Each action is pinned to a commit, as Nouride's are.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # nouverse/nougate

jobs:
  build-and-push:
    # A push to main that passed: not a pull request's run, not a failed one.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, build-runner]
    permissions:
      contents: read
      packages: write

    steps:
      # The commit Test ran on. `github.sha` is the default branch's tip when this starts, which a later push may
      # already have moved past the tested commit.
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: The commit's short SHA
        id: commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.commit.outputs.short }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
