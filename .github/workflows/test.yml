name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# On a GitHub-hosted runner, as Nouride's public repository is: this one is public too, so its minutes cost nothing,
# and a pull request from a fork never runs on a machine at home. The self-hosted line is kept, commented, beside
# each `runs-on`, for going back.
jobs:
  test:
    # runs-on: [self-hosted, build-runner]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint:check

      - name: Run backend unit tests
        run: bun test tests/unit

      # `vite build` runs first on purpose: the TanStack router plugin
      # generates src/routeTree.gen.ts, which is gitignored, so a bare `tsc -b`
      # on a clean checkout fails on every route file.
      - name: Build and type check frontend
        run: cd apps/frontend && bun run build

      - name: Run frontend tests
        run: cd apps/frontend && bun test tests
