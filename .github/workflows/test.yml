name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint:check

      - name: Run backend unit tests
        run: bun test tests/unit

      # `vite build` runs first on purpose: the TanStack router plugin
      # generates src/routeTree.gen.ts, which is gitignored, so a bare `tsc -b`
      # on a clean checkout fails on every route file.
      - name: Build and type check frontend
        run: cd apps/frontend && bun run build

      - name: Run frontend tests
        run: cd apps/frontend && bun test tests
