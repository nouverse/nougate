name: nougate

services:
  nougate:
    image: ghcr.io/nouverse-tech/nougate:latest
    container_name: nougate
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Set the gateway base URL
      - BASE_URL=https://nougate.nouverse.tech
      # Set the listening port (default: 3000)
      - PORT=3000
      - HEADROOM_URL=http://headroom:8787
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      # Persistent data directory storing config.json and provider account databases
      - ./nougate-data:/app/data:z
    depends_on:
      - headroom
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    environment:
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - VECLIB_MAXIMUM_THREADS=2
      - NUMEXPR_NUM_THREADS=2
