name: nougate

services:
  nougate:
    image: ghcr.io/nouverse/nougate:latest
    container_name: nougate
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Everything in .env is passed into the container. Without this, Compose
    # would still read .env — but only to substitute ${...} in this file, not to
    # set variables inside the container. Any key not also listed under
    # `environment:` would be silently ignored by the app.
    env_file:
      - path: .env
        required: false
    environment:
      # Explicit entries win over env_file, so these are the values that must
      # differ inside Docker regardless of what .env says.
      - HEADROOM_URL=${HEADROOM_URL:-}
      # Pinned, NOT read from .env: a checkout's .env usually holds a localhost
      # BASE_URL for development, and silently inheriting it in production would
      # drop the Secure flag from session cookies and break OAuth redirects.
      # Change the value here when deploying to a different domain.
      - BASE_URL=${BASE_URL:-https://nougate.nouverse.tech}
      - PORT=${PORT:-3000}
      # The rest are listed rather than left to env_file so this file is the
      # full inventory of what the container reads. `${VAR:-}` leaves a variable
      # as an empty string when .env does not set it, which each of these treats
      # as unset.
      # ── Dashboard bootstrap account ──
      # Required on a fresh deployment. No fallback: unset means nobody can sign
      # in. Read only while the user table is empty.
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      # ── Dashboard sessions ──
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-}
      # Database (DB_URL, NOUGATE_DB_PATH) and the pricing fallbacks are
      # deliberately not listed: they still reach the container through env_file
      # above, and hardcoding a connection string into a committed file is how
      # credentials end up in git.
      # ── Pod limits ──
      # Blank = not enforced. BOTTOM_JITTER is a floor on every provider's
      # request delay; MAX_ACCOUNT_MULTIPLEXING caps accounts per provider.
      - BOTTOM_JITTER=${BOTTOM_JITTER:-}
      - MAX_ACCOUNT_MULTIPLEXING=${MAX_ACCOUNT_MULTIPLEXING:-}
    volumes:
      # Persistent data directory storing config.json and provider account databases
      - ./nougate-data:/app/data:z
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
